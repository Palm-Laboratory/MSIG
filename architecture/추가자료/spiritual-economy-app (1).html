        function App() {
            const [currentTab, setCurrentTab] = useState('daily');
            const [selectedDate, setSelectedDate] = useState(new Date());
            const [dailyData, setDailyData] = useState({});

            // 로컬 스토리지에서 데이터 로드
            useEffect(() => {
                const saved = localStorage.getItem('spiritualEconomyData');
                if (saved) {
                    setDailyData(JSON.parse(saved));
                }
            }, []);

            // 데이터 저장
            useEffect(() => {
                localStorage.setItem('spiritualEconomyData', JSON.stringify(dailyData));
            }, [dailyData]);

            const getDateKey = (date) => {
                return date.toISOString().split('T')[0];
            };

            const getCurrentDateData = () => {
                const key = getDateKey(selectedDate);
                return dailyData[key] || { 
                    earning: [],
                    spending: [],
                    saving: [],
                    giving: [],
                    spiritual: [],
                    morningPrayer: '',
                    eveningGratitude: ['', '', '']
                };
            };

            const saveJournal = (type, value) => {
                const key = getDateKey(selectedDate);
                const currentData = dailyData[key] || { 
                    earning: [],
                    spending: [],
                    saving: [],
                    giving: [],
                    spiritual: [],
                    morningPrayer: '',
                    eveningGratitude: ['', '', '']
                };

                setDailyData({
                    ...dailyData,
                    [key]: {
                        ...currentData,
                        [type]: value
                    }
                });
            };

            const toggleChecklistItem = (category, index) => {
                const key = getDateKey(selectedDate);
                const currentData = dailyData[key] || { 
                    earning: [],
                    spending: [],
                    saving: [],
                    giving: [],
                    spiritual: [],
                    morningPrayer: '',
                    eveningGratitude: ['', '', '']
                };

                const newData = { ...currentData };
                if (!newData[category]) newData[category] = [];
                
                if (newData[category].includes(index)) {
                    newData[category] = newData[category].filter(i => i !== index);
                } else {
                    newData[category] = [...newData[category], index];
                }

                setDailyData({
                    ...dailyData,
                    [key]: newData
                });
            };

            const calculateScore = (category) => {
                const data = getCurrentDateData();
                const total = initialChecklistData[category].length;
                const completed = (data[category] || []).length;
                return Math.round((completed / total) * 100);
            };

            const calculateTotalScore = () => {
                const categories = ['earning', 'spending', 'saving', 'giving', 'spiritual'];
                const scores = categories.map(cat => calculateScore(cat));
                return Math.round(scores.reduce((a, b) => a + b, 0) / categories.length);
            };

            const changeDate = (days) => {
                const newDate = new Date(selectedDate);
                newDate.setDate(newDate.getDate() + days);
                setSelectedDate(newDate);
            };

            const goToToday = () => {
                setSelectedDate(new Date());
            };

            const getWeekData = () => {
                const weekData = [];
                const today = new Date(selectedDate);
                
                for (let i = 6; i >= 0; i--) {
                    const date = new Date(today);
                    date.setDate(date.getDate() - i);
                    const key = getDateKey(date);
                    const data = dailyData[key];
                    
                    let totalScore = 0;
                    if (data) {
                        const categories = ['earning', 'spending', 'saving', 'giving', 'spiritual'];
                        const scores = categories.map(cat => {
                            const total = initialChecklistData[cat].length;
                            const completed = (data[cat] || []).length;
                            return (completed / total) * 100;
                        });
                        totalScore = scores.reduce((a, b) => a + b, 0) / categories.length;
                    }
                    
                    weekData.push({
                        date: date.toLocaleDateString('ko-KR', { month: 'short', day: 'numeric' }),
                        score: Math.round(totalScore)
                    });
                }
                
                return weekData;
            };

            return (
                <div className="app-container">
                    <div className="header">
                        <h1>🙏 영재(靈財)</h1>
                        <p>영적 습관과 경제 구조의 통합 성장 플랫폼</p>
                    </div>

                    <div className="main-content">
                        <div className="nav-tabs">
                            <button 
                                className={`nav-tab ${currentTab === 'daily' ? 'active' : ''}`}
                                onClick={() => setCurrentTab('daily')}
                            >
                                📝 일일 체크
                            </button>
                            <button 
                                className={`nav-tab ${currentTab === 'weekly' ? 'active' : ''}`}
                                onClick={() => setCurrentTab('weekly')}
                            >
                                📊 주간 분석
                            </button>
                            <button 
                                className={`nav-tab ${currentTab === 'reading' ? 'active' : ''}`}
                                onClick={() => setCurrentTab('reading')}
                            >
                                📚 주간 독서노트
                            </button>
                            <button 
                                className={`nav-tab ${currentTab === 'content' ? 'active' : ''}`}
                                onClick={() => setCurrentTab('content')}
                            >
                                📖 시편 재정 원리
                            </button>
                        </div>

                        {currentTab === 'daily' && <DailyTab 
                            selectedDate={selectedDate}
                            changeDate={changeDate}
                            goToToday={goToToday}
                            currentData={getCurrentDateData()}
                            toggleChecklistItem={toggleChecklistItem}
                            calculateScore={calculateScore}
                            calculateTotalScore={calculateTotalScore}
                            saveJournal={saveJournal}
                        />}

                        {currentTab === 'weekly' && <WeeklyTab 
                            weekData={getWeekData()}
                            calculateScore={calculateScore}
                            currentData={getCurrentDateData()}
                        />}

                        {currentTab === 'reading' && <ReadingNoteTab 
                            dailyData={dailyData}
                            setDailyData={setDailyData}
                        />}

                        {currentTab === 'content' && <ContentTab />}
                    </div>
                </div>
            );
        }

        function DailyTab({ selectedDate, changeDate, goToToday, currentData, toggleChecklistItem, calculateScore, calculateTotalScore, saveJournal }) {
            const isToday = getDateKey(selectedDate) === getDateKey(new Date());

            return (
                <>
                    <div className="date-selector">
                        <button onClick={() => changeDate(-1)}>◀ 이전</button>
                        <div className="date-display">
                            {selectedDate.toLocaleDateString('ko-KR', { 
                                year: 'numeric', 
                                month: 'long', 
                                day: 'numeric',
                                weekday: 'short'
                            })}
                        </div>
                        <button onClick={() => changeDate(1)}>다음 ▶</button>
                        {!isToday && (
                            <button onClick={goToToday} className="btn-primary">오늘</button>

                    <div className="score-display">

                        <div className="score-card">
                            <h3>경제 실천</h3>

                                {Math.round((calculateScore('earning') + calculateScore('spending') + calculateScore('saving') + calculateScore('giving')) / 4)}
                            </div>
                        </div>
                    </div>

                    <MorningPrayerNote 
                        value={currentData.morningPrayer || ''}

                    <ChecklistSection

                        category="spiritual"
                        items={initialChecklistData.spiritual}
                        completed={currentData.spiritual || []}
                        onToggle={toggleChecklistItem}
                        color="#ffa726"
                    />

                    <ChecklistSection 
                        title="💰 벌기 (Earning) - 소명의 씨앗"
                        category="earning"
                        items={initialChecklistData.earning}
                        completed={currentData.earning || []}
                        onToggle={toggleChecklistItem}
                        color="#66bb6a"
                    />

                    <ChecklistSection 
                        title="🛒 쓰기 (Spending) - 지혜의 관문"
                        category="spending"
                        items={initialChecklistData.spending}
                        completed={currentData.spending || []}
                        onToggle={toggleChecklistItem}
                        color="#42a5f5"
                    />

                    <ChecklistSection 
                        title="💎 더하기 (Saving) - 미래의 창고"
                        category="saving"
                        items={initialChecklistData.saving}
                        completed={currentData.saving || []}
                        onToggle={toggleChecklistItem}
                        color="#ab47bc"
                    />

                    <ChecklistSection 
                        title="❤️ 나누기 (Giving) - 흘러넘치는 샘"
                        category="giving"
                        items={initialChecklistData.giving}
                        completed={currentData.giving || []}
                        onToggle={toggleChecklistItem}
                        color="#ef5350"
                    />

                    <EveningGratitudeJournal 
                        gratitudes={currentData.eveningGratitude || ['', '', '']}
                        onChange={(gratitudes) => saveJournal('eveningGratitude', gratitudes)}
                    />
                </>
            );
        }

        function ChecklistSection({ title, category, items, completed, onToggle, color }) {
            const score = Math.round((completed.length / items.length) * 100);

            return (
                <div className="card" style={{ borderLeftColor: color }}>
                    <div className="card-header">
                        <span>{title}</span>

                    <div className="progress-bar">

                    </div>
                    <ul className="checklist">
                        {items.map((item, index) => (
                            <li 
                                key={index}
                                className={`checklist-item ${completed.includes(index) ? 'completed' : ''}`}
                                onClick={() => onToggle(category, index)}
                            >
                                <div className={`checkbox ${completed.includes(index) ? 'checked' : ''}`}>
                                    {completed.includes(index) && '✓'}
                                </div>
                                <span>{item}</span>
                            </li>

                    </ul>
                </div>

        }

        function AICoaching({ weekData }) {
            const avgScore = Math.round(weekData.reduce((a, b) => a + b.score, 0) / weekData.length);
            
            const getCoachingMessage = () => {
                if (avgScore >= 90) {
                    return {
                        title: "🌟 탁월한 한 주였습니다!",
                        message: "영적 습관과 경제적 실천이 조화롭게 이루어지고 있습니다. 이 일관성을 유지하며, 다음 단계로 다른 사람들을 멘토링하는 것을 고려해보세요.",
                        psalm: "시편 1편: '그는 시냇가에 심은 나무가 철을 따라 열매를 맺으며' - 당신의 습관이 열매를 맺고 있습니다."
                    };
                } else if (avgScore >= 70) {
                    return {
                        title: "👍 좋은 진전을 보이고 있습니다",
                        message: "일관성 있게 실천하고 계십니다. '나누기' 영역을 좀 더 강화하면 더 큰 영적-경제적 선순환을 경험할 수 있습니다.",
                        psalm: "시편 112편: '은혜를 베풀며 꾸어 주고' - 나눔은 소비가 아니라 영적 투자입니다."
                    };
                } else if (avgScore >= 50) {
                    return {
                        title: "💪 꾸준함이 필요합니다",
                        message: "시작이 반입니다. 특히 '영적 습관' 영역을 먼저 안정화시키세요. 영적 기초가 탄탄해지면 경제 영역도 자연스럽게 개선됩니다.",
                        psalm: "시편 23편: '여호와는 나의 목자시니 내게 부족함이 없으리로다' - 하나님을 신뢰하며 한 걸음씩 나아가세요."
                    };
                } else {
                    return {
                        title: "🌱 새로운 시작",
                        message: "완벽함보다 꾸준함이 중요합니다. 하루에 한 가지 작은 습관부터 시작하세요. 새벽 5분 기도, 감사 1가지 기록하기부터 시작해보세요.",
                        psalm: "시편 37편: '네 길을 여호와께 맡기라 그를 의지하면 그가 이루시리로다' - 작은 시작이 큰 변화를 만듭니다."
                    };
                }
            };

            const coaching = getCoachingMessage();

            return (
                <div className="spiritual-content">
                    <h4>{coaching.title}</h4>
                    <p>{coaching.message}</p>
                    <p style={{ marginTop: '10px', fontStyle: 'italic' }}>📖 {coaching.psalm}</p>
                </div>
            );
        }

        function ReadingNoteTab({ dailyData, setDailyData }) {
            const getReadingNotes = () => {
                return dailyData.readingNotes || [];
            };

            const addNewBook = () => {
                const newBook = {
                    id: Date.now(),
                    title: '',
                    author: '',
                    startDate: new Date().toISOString().split('T')[0],
                    endDate: '',
                    pages: '',
                    summary: '',
                    keyQuotes: '',
                    insights: '',
                    application: ''
                };

                const readingNotes = getReadingNotes();
                setDailyData({
                    ...dailyData,
                    readingNotes: [newBook, ...readingNotes]
                });
            };

            const updateBook = (id, field, value) => {
                const readingNotes = getReadingNotes();
                const updatedNotes = readingNotes.map(book => 
                    book.id === id ? { ...book, [field]: value } : book
                );
                setDailyData({
                    ...dailyData,
                    readingNotes: updatedNotes

        function getStreak(weekData) {
            let streak = 0;
            for (let i = weekData.length - 1; i >= 0; i--) {
                if (weekData[i].score > 0) {
                    streak++;
                } else {
                    break;
                }
            }
            return streak;
        }
