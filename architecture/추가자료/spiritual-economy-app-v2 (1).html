<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영재(靈財) - 영적습관 × 경제구조 통합 앱</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            padding: 20px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.95;
        }

        .main-content {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #e0e0e0;
            flex-wrap: wrap;
        }

        .nav-tab {
            padding: 12px 24px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .nav-tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .nav-tab:hover {
            color: #667eea;
        }

        .section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }

        .card-header {
            font-size: 1.2em;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .checklist {
            list-style: none;
        }

        .checklist-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            margin-bottom: 8px;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .checklist-item:hover {
            transform: translateX(5px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .checklist-item.completed {
            opacity: 0.7;
        }

        .checkbox {
            width: 24px;
            height: 24px;
            border: 2px solid #667eea;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .checkbox.checked {
            background: #667eea;
            color: white;
        }

        .score-display {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .score-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .score-card h3 {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 10px;
        }

        .score-card .score {
            font-size: 2.5em;
            font-weight: bold;
        }

        .progress-bar {
            background: #e0e0e0;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            height: 100%;
            transition: width 0.3s;
        }

        .date-selector {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .date-selector button {
            padding: 8px 16px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .date-selector button:hover {
            background: #667eea;
            color: white;
        }

        .date-display {
            font-size: 1.2em;
            font-weight: 600;
            color: #333;
            min-width: 200px;
            text-align: center;
        }

        .spiritual-content {
            background: #fff9e6;
            border-left: 4px solid #ffa726;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .spiritual-content h4 {
            color: #f57c00;
            margin-bottom: 10px;
        }

        .spiritual-content p {
            color: #555;
            line-height: 1.6;
        }

        .journal-section {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 2px solid #e0e0e0;
        }

        .journal-section.morning {
            border-left: 4px solid #ffa726;
            background: linear-gradient(to right, #fff9e6 0%, #ffffff 100%);
        }

        .journal-section.evening {
            border-left: 4px solid #5c6bc0;
            background: linear-gradient(to right, #e8eaf6 0%, #ffffff 100%);
        }

        .journal-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            font-size: 1.3em;
            font-weight: 600;
            color: #333;
        }

        .journal-textarea {
            width: 100%;
            min-height: 150px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.3s;
            line-height: 1.6;
        }

        .journal-textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .journal-prompt {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            color: #555;
            font-size: 0.95em;
            line-height: 1.6;
        }

        .gratitude-list {
            list-style: none;
            margin-bottom: 15px;
        }

        .gratitude-item {
            background: white;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 6px;
            border-left: 3px solid #5c6bc0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .gratitude-number {
            background: #5c6bc0;
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9em;
            font-weight: bold;
            flex-shrink: 0;
        }

        .gratitude-input {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 1em;
            padding: 5px;
        }

        .gratitude-input:focus {
            outline: none;
            background: #f8f9fa;
            border-radius: 4px;
        }

        .chart-container {
            position: relative;
            height: 300px;
            margin: 20px 0;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }
            
            .main-content {
                padding: 20px;
            }
            
            .score-display {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const initialChecklistData = {
            earning: [
                "이번 주 나의 강점 3가지 확인했는가?",
                "소명과 연결된 수입원을 개발하고 있는가?",
                "월 수입 목표 vs 실제 달성률을 점검했는가?",
                "부수입 아이디어 1개 이상 실행했는가?"
            ],
            spending: [
                "이번 주 충동구매 0건 달성했는가?",
                "구매 전 24시간 기다림 원칙을 지켰는가?",
                "예산 대비 지출 90% 이내를 유지했는가?",
                "하나님 영광을 위한 소비였는가?"
            ],
            saving: [
                "월 수입의 20% 이상 저축했는가?",
                "비상금 6개월치 확보 상태를 점검했는가?",
                "투자 공부를 주 1회 이상 했는가?",
                "장기 재정 목표를 점검했는가?"
            ],
            giving: [
                "정기 헌금/기부를 실천했는가?",
                "이번 주 1명 이상 도왔는가?",
                "비물질적 나눔(시간, 재능)을 했는가?",
                "나눔 후 감사 기도를 드렸는가?"
            ],
            spiritual: [
                "새벽기도를 드렸는가?",
                "성경 1장 이상 읽었는가?",
                "감사 3가지를 기록했는가?",
                "새로운 친구 한 명 사귀기 위해 노력했는가?",
                "하루를 기도로 마무리했는가?"
            ]
        };

        function App() {
            const [currentTab, setCurrentTab] = useState('daily');
            const [selectedDate, setSelectedDate] = useState(new Date());
            const [dailyData, setDailyData] = useState({});

            useEffect(() => {
                const saved = localStorage.getItem('spiritualEconomyData');
                if (saved) {
                    setDailyData(JSON.parse(saved));
                }
            }, []);

            useEffect(() => {
                localStorage.setItem('spiritualEconomyData', JSON.stringify(dailyData));
            }, [dailyData]);

            const getDateKey = (date) => {
                return date.toISOString().split('T')[0];
            };

            const getCurrentDateData = () => {
                const key = getDateKey(selectedDate);
                return dailyData[key] || { 
                    earning: [],
                    spending: [],
                    saving: [],
                    giving: [],
                    spiritual: [],
                    morningPrayer: '',
                    eveningGratitude: ['', '', '']
                };
            };

            const toggleChecklistItem = (category, index) => {
                const key = getDateKey(selectedDate);
                const currentData = dailyData[key] || { 
                    earning: [],
                    spending: [],
                    saving: [],
                    giving: [],
                    spiritual: [],
                    morningPrayer: '',
                    eveningGratitude: ['', '', '']
                };

                const newData = { ...currentData };
                if (!newData[category]) newData[category] = [];
                
                if (newData[category].includes(index)) {
                    newData[category] = newData[category].filter(i => i !== index);
                } else {
                    newData[category] = [...newData[category], index];
                }

                setDailyData({
                    ...dailyData,
                    [key]: newData
                });
            };

            const saveJournal = (type, value) => {
                const key = getDateKey(selectedDate);
                const currentData = dailyData[key] || { 
                    earning: [],
                    spending: [],
                    saving: [],
                    giving: [],
                    spiritual: [],
                    morningPrayer: '',
                    eveningGratitude: ['', '', '']
                };

                setDailyData({
                    ...dailyData,
                    [key]: {
                        ...currentData,
                        [type]: value
                    }
                });
            };

            const calculateScore = (category) => {
                const data = getCurrentDateData();
                const total = initialChecklistData[category].length;
                const completed = (data[category] || []).length;
                return Math.round((completed / total) * 100);
            };

            const calculateTotalScore = () => {
                const categories = ['earning', 'spending', 'saving', 'giving', 'spiritual'];
                const scores = categories.map(cat => calculateScore(cat));
                return Math.round(scores.reduce((a, b) => a + b, 0) / categories.length);
            };

            const changeDate = (days) => {
                const newDate = new Date(selectedDate);
                newDate.setDate(newDate.getDate() + days);
                setSelectedDate(newDate);
            };

            const goToToday = () => {
                setSelectedDate(new Date());
            };

            return (
                <div className="app-container">
                    <div className="header">
                        <h1>🙏 영재(靈財)</h1>
                        <p>영적 습관과 경제 구조의 통합 성장 플랫폼</p>
                    </div>

                    <div className="main-content">
                        <div className="nav-tabs">
                            <button 
                                className={`nav-tab ${currentTab === 'daily' ? 'active' : ''}`}
                                onClick={() => setCurrentTab('daily')}
                            >
                                📝 일일 체크
                            </button>
                            <button 
                                className={`nav-tab ${currentTab === 'guide' ? 'active' : ''}`}
                                onClick={() => setCurrentTab('guide')}
                            >
                                💎 자산 가이드
                            </button>
                        </div>

                        {currentTab === 'daily' && (
                            <DailyTab 
                                selectedDate={selectedDate}
                                changeDate={changeDate}
                                goToToday={goToToday}
                                currentData={getCurrentDateData()}
                                toggleChecklistItem={toggleChecklistItem}
                                calculateScore={calculateScore}
                                calculateTotalScore={calculateTotalScore}
                                saveJournal={saveJournal}
                            />
                        )}

                        {currentTab === 'guide' && <AssetGuideTab />}
                    </div>
                </div>
            );
        }

        function DailyTab({ selectedDate, changeDate, goToToday, currentData, toggleChecklistItem, calculateScore, calculateTotalScore, saveJournal }) {
            const getDateKey = (date) => date.toISOString().split('T')[0];
            const isToday = getDateKey(selectedDate) === getDateKey(new Date());

            return (
                <>
                    <div className="date-selector">
                        <button onClick={() => changeDate(-1)}>◀ 이전</button>
                        <div className="date-display">
                            {selectedDate.toLocaleDateString('ko-KR', { 
                                year: 'numeric', 
                                month: 'long', 
                                day: 'numeric',
                                weekday: 'short'
                            })}
                        </div>
                        <button onClick={() => changeDate(1)}>다음 ▶</button>
                        {!isToday && (
                            <button onClick={goToToday} className="btn-primary">오늘</button>
                        )}
                    </div>

                    <div className="score-display">
                        <div className="score-card">
                            <h3>총점</h3>
                            <div className="score">{calculateTotalScore()}</div>
                        </div>
                        <div className="score-card">
                            <h3>영적 습관</h3>
                            <div className="score">{calculateScore('spiritual')}</div>
                        </div>
                        <div className="score-card">
                            <h3>경제 실천</h3>
                            <div className="score">
                                {Math.round((calculateScore('earning') + calculateScore('spending') + calculateScore('saving') + calculateScore('giving')) / 4)}
                            </div>
                        </div>
                    </div>

                    <MorningPrayerNote 
                        value={currentData.morningPrayer || ''}
                        onChange={(value) => saveJournal('morningPrayer', value)}
                    />

                    <ChecklistSection 
                        title="🌅 영적 습관"
                        category="spiritual"
                        items={initialChecklistData.spiritual}
                        completed={currentData.spiritual || []}
                        onToggle={toggleChecklistItem}
                        color="#ffa726"
                    />

                    <ChecklistSection 
                        title="💰 벌기 (Earning)"
                        category="earning"
                        items={initialChecklistData.earning}
                        completed={currentData.earning || []}
                        onToggle={toggleChecklistItem}
                        color="#66bb6a"
                    />

                    <ChecklistSection 
                        title="🛒 쓰기 (Spending)"
                        category="spending"
                        items={initialChecklistData.spending}
                        completed={currentData.spending || []}
                        onToggle={toggleChecklistItem}
                        color="#42a5f5"
                    />

                    <ChecklistSection 
                        title="💎 더하기 (Saving)"
                        category="saving"
                        items={initialChecklistData.saving}
                        completed={currentData.saving || []}
                        onToggle={toggleChecklistItem}
                        color="#ab47bc"
                    />

                    <ChecklistSection 
                        title="❤️ 나누기 (Giving)"
                        category="giving"
                        items={initialChecklistData.giving}
                        completed={currentData.giving || []}
                        onToggle={toggleChecklistItem}
                        color="#ef5350"
                    />

                    <EveningGratitudeJournal 
                        gratitudes={currentData.eveningGratitude || ['', '', '']}
                        onChange={(gratitudes) => saveJournal('eveningGratitude', gratitudes)}
                    />
                </>
            );
        }

        function ChecklistSection({ title, category, items, completed, onToggle, color }) {
            const score = Math.round((completed.length / items.length) * 100);

            return (
                <div className="card" style={{ borderLeftColor: color }}>
                    <div className="card-header">
                        <span>{title}</span>
                        <span style={{ color: color }}>{score}%</span>
                    </div>
                    <div className="progress-bar">
                        <div className="progress-fill" style={{ width: `${score}%`, background: color }}></div>
                    </div>
                    <ul className="checklist">
                        {items.map((item, index) => (
                            <li 
                                key={index}
                                className={`checklist-item ${completed.includes(index) ? 'completed' : ''}`}
                                onClick={() => onToggle(category, index)}
                            >
                                <div className={`checkbox ${completed.includes(index) ? 'checked' : ''}`}>
                                    {completed.includes(index) && '✓'}
                                </div>
                                <span>{item}</span>
                            </li>
                        ))}
                    </ul>
                </div>
            );
        }

        function MorningPrayerNote({ value, onChange }) {
            const [localValue, setLocalValue] = useState(value);

            useEffect(() => {
                setLocalValue(value);
            }, [value]);

            const handleChange = (e) => {
                const newValue = e.target.value;
                setLocalValue(newValue);
                onChange(newValue);
            };

            return (
                <div className="journal-section morning">
                    <div className="journal-header">
                        <span>🌅</span>
                        <span>오늘 하루 시작 기도 노트</span>
                    </div>
                    <div className="journal-prompt">
                        💭 오늘 하루를 어떻게 시작하시겠습니까? 하나님께 드리고 싶은 기도를 자유롭게 적어보세요.
                    </div>
                    <textarea 
                        className="journal-textarea"
                        placeholder="하나님 아버지, 오늘 하루를..."
                        value={localValue}
                        onChange={handleChange}
                    />
                </div>
            );
        }

        function EveningGratitudeJournal({ gratitudes, onChange }) {
            const [localGratitudes, setLocalGratitudes] = useState(gratitudes);

            useEffect(() => {
                setLocalGratitudes(gratitudes);
            }, [gratitudes]);

            const handleGratitudeChange = (index, value) => {
                const newGratitudes = [...localGratitudes];
                newGratitudes[index] = value;
                setLocalGratitudes(newGratitudes);
                onChange(newGratitudes);
            };

            return (
                <div className="journal-section evening">
                    <div className="journal-header">
                        <span>🌙</span>
                        <span>하루 마감 감사 일기</span>
                    </div>
                    <div className="journal-prompt">
                        💙 오늘 하루를 돌아보며 감사한 것 3가지를 적어주세요.
                    </div>
                    <ul className="gratitude-list">
                        {[0, 1, 2].map(index => (
                            <li key={index} className="gratitude-item">
                                <div className="gratitude-number">{index + 1}</div>
                                <input 
                                    type="text"
                                    className="gratitude-input"
                                    placeholder={`감사 ${index + 1}: 오늘 감사한 것은...`}
                                    value={localGratitudes[index] || ''}
                                    onChange={(e) => handleGratitudeChange(index, e.target.value)}
                                />
                            </li>
                        ))}
                    </ul>
                </div>
            );
        }

        function AssetGuideTab() {
            return (
                <div className="section">
                    <h2 className="section-title">💎 자산을 불리는 성경적 투자 가이드</h2>
                    
                    <div className="spiritual-content">
                        <h4>🙏 시작하기 전에</h4>
                        <p>
                            자산 증식은 탐욕이 아닙니다. 하나님께서 맡기신 자원을 지혜롭게 관리하는 청지기의 책임입니다.
                            <br/><br/>
                            투자의 목적은 단순히 돈을 버는 것이 아니라, 하나님 나라를 위해 더 많이 나눌 수 있는 능력을 키우는 것입니다.
                        </p>
                    </div>

                    <div className="card">
                        <div className="card-header">1단계: 청지기 정신 확립 🙏</div>
                        <p style={{ color: '#555', lineHeight: '1.6' }}>
                            모든 것이 하나님의 것임을 인정하세요. 십일조와 헌금을 먼저 드리는 것이 재정 축복의 시작입니다.
                        </p>
                    </div>

                    <div className="card">
                        <div className="card-header">2단계: 비상금 마련 🛡️</div>
                        <p style={{ color: '#555', lineHeight: '1.6' }}>
                            월 생활비의 6개월치를 저축하세요. 이것이 확보되기 전까지는 공격적 투자를 자제하세요.
                            <br/><br/>
                            <strong>예시:</strong> 월 300만원 생활 → 1,800만원 비상금 확보
                        </p>
                    </div>

                    <div className="card">
                        <div className="card-header">3단계: 자산 배분 📊</div>
                        <p style={{ color: '#555', lineHeight: '1.6', marginBottom: '15px' }}>

                        </p>
                        <div style={{ background: 'white', padding: '15px', borderRadius: '8px', marginBottom: '10px' }}>
                            <strong>30대 공격적:</strong> 안전 20% + 성장 55% + 보험 10% + 대체자산 15%
                        </div>
                        <div style={{ background: 'white', padding: '15px', borderRadius: '8px', marginBottom: '10px' }}>
                            <strong>40대 균형:</strong> 안전 40% + 성장 40% + 보험 10% + 대체자산 10%
                        </div>
                        <div style={{ background: 'white', padding: '15px', borderRadius: '8px' }}>
                            <strong>50대+ 보수적:</strong> 안전 60% + 성장 25% + 보험 10% + 대체자산 5%
                        </div>
                    </div>

                    <div className="card">
                        <div className="card-header">4단계: 보험 - 가족을 지키는 방패 🛡️</div>
                        <p style={{ color: '#555', lineHeight: '1.6' }}>
                            <strong>필수:</strong> 실손의료보험, 종신보험, 자동차보험
                            <br/>
                            <strong>권장:</strong> 연금보험, 암보험
                            <br/>
                            <strong>원칙:</strong> 소득의 10% 이내로 보험료 제한
                        </p>
                    </div>

                    <div className="card">
                        <div className="card-header">5단계: 해외 금융 - 글로벌 분산 🌍</div>
                        <p style={{ color: '#555', lineHeight: '1.6' }}>
                            <strong>미국 ETF:</strong> S&P500 (VOO, SPY), 전세계 (VT)
                            <br/>
                            <strong>비중:</strong> 전체 자산의 30-50%
                            <br/>
                            <strong>주의:</strong> 환율 변동, 양도소득세 22% (250만원 초과)
                        </p>
                    </div>

                    <div className="card">
                        <div className="card-header">6단계: 금(Gold) - 위기의 안전자산 🥇</div>
                        <p style={{ color: '#555', lineHeight: '1.6' }}>
                            <strong>방법:</strong> 금 ETF (KODEX 골드선물)
                            <br/>
                            <strong>비중:</strong> 전체의 5-10%
                            <br/>
                            <strong>역할:</strong> 인플레이션 헤지, 보험 성격
                        </p>
                    </div>

                    <div className="card" style={{ borderLeft: '4px solid #ef5350' }}>
                        <div className="card-header">7단계: 암호화폐 - 초고위험 ₿</div>
                        <p style={{ color: '#c62828', lineHeight: '1.6', fontWeight: '600' }}>
                            ⚠️ 전체 자산의 2-5% 이내만! 잃어도 괜찮은 돈으로만!
                        </p>
                        <p style={{ color: '#555', lineHeight: '1.6', marginTop: '10px' }}>
                            <strong>허용:</strong> 비트코인 + 이더리움만, 장기 보유
                            <br/>
                            <strong>절대 금지:</strong> 대출 투자, 레버리지, 단타매매
                            <br/><br/>
                            💚 "코인은 있으면 좋고, 없어도 괜찮은 자산입니다."
                        </p>
                    </div>

                    <div className="card">
                        <div className="card-header">8단계: 정기 적립식 투자 💰</div>
                        <p style={{ color: '#555', lineHeight: '1.6' }}>
                            매월 일정 금액을 자동으로 투자하세요. 복리의 힘은 시간이 만듭니다.
                            <br/><br/>
                            <strong>예시:</strong> 월 100만원 × 20년 × 연 7% = 약 5억 2천만원
                        </p>
                    </div>

                    <div className="spiritual-content">
                        <h4>💡 복음영성디자이너의 마지막 조언</h4>
                        <p>
                            투자는 마라톤입니다. 34년 목회를 하며 깨달은 것은, 영적 습관이 탄탄한 사람이 재정도 지혜롭게 관리한다는 것입니다.
                            <br/><br/>
                            매일 기도하며, 하나님께 맡기고, 인내로 기다리세요.
                            <br/><br/>
                            <strong>"부지런한 자의 계획은 풍부함에 이를 것이요" (잠언 21:5)</strong>
                        </p>
                    </div>
                </div>
            );
        }
